name: 内核构建流程

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== 基础配置 ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU 配置 ====================
      ksu_variant:
        required: true
        type: string
      ksu_mode:
        required: false
        type: string
        default: 关闭

      # ==================== 可选配置 ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: "r1"
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 功能开关 ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_kpm:
        required: true
        type: string
        default: "disabled (关闭)"
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      # LTO 模式: auto = 保留历史行为(6.1 及以下 thin / 6.12 自动 none)
      #            none = --lto=none(KMI 敏感的第三方机型必须与原厂一致)
      lto_mode:
        required: false
        type: string
        default: "auto"
      # 追加自定义内核配置(多行字符串,直接 append 到 gki_defconfig)
      extra_config:
        required: false
        type: string
        default: ""
      # boot.img 是否加 AVB hash footer: 签名 = 旧行为(自带生成的密钥 + 补齐到 64MiB)
      #   不签名 = 与"能启动的参考镜像"结构一致(os 版本照写, 不签名, 只零填充到分区大小)
      boot_sign:
        required: false
        type: string
        default: "签名"
      # ==================== 内核源码来源(默认 AOSP ACK) ====================
      # 厂商模块会导入一些只存在于厂商 fork 里的私有导出符号(纯 ACK 树没有/未导出),
      # 这时必须用同源的树构建, 否则模块加载失败 → 卡第一屏。见 tools/override_manifest_common.py
      # 例: kernel_repo=clo/la/kernel/common  kernel_branch=ks-kernel.lnx.3.0.c2
      kernel_repo:
        required: false
        type: string
        default: ""
      kernel_branch:
        required: false
        type: string
        default: ""

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "       内核构建配置摘要"
          echo "========================================"
          echo "Android 版本  : ${{ inputs.android_version }}"
          echo "内核版本      : ${{ inputs.kernel_version }}"
          echo "子版本号      : ${{ inputs.sub_level }}"
          echo "补丁级别      : ${{ inputs.os_patch_level }}"
          echo "KSU 变体      : ${{ inputs.ksu_variant }}"
          echo "构建时间      : ${{ inputs.build_time }}"
          echo "SUSFS 状态    : ${{ inputs.enable_susfs }}"
          echo "ZRAM 增强     : ${{ inputs.use_zram }}"
          echo "BBG 补丁      : ${{ inputs.use_bbg }}"
          echo "KPM 功能      : ${{ inputs.use_kpm }}"
          echo "Re-Kernel     : ${{ inputs.use_rekernel }}"
          echo "网络增强      : ${{ inputs.use_networking }}"
          echo "CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}"
          echo "SUSFS 集成补丁导出: ${{ inputs.export_susfs_patches }}"
          echo "Droidspaces   : ${{ inputs.droidspaces }}"
          echo "NTSync        : ${{ inputs.droidspaces_ntsync }}"
          echo "产物上传模式  : ${{ inputs.artifact_upload_mode }}"
          echo "Stock Config  : 自动检测 config/stock_defconfig"
          echo "========================================"

      - name: 清理磁盘空间
        run: |
          # 先并行 mv 到临时目录（瞬时完成），再在后台低优先级删除，不阻塞后续步骤
          # 临时目录必须放在工作区之外：checkout 会以 runner 用户清空工作区，
          # 遇到 sudo mv 进来的 root 属主文件会 EACCES 失败
          TRASH_DIR=/tmp/.background_trash
          sudo rm -rf "$TRASH_DIR"
          mkdir -p "$TRASH_DIR"/{1..17}

          safe_mv() {
            [ -e "$1" ] && sudo mv "$1" "$2" || true
          }
          export -f safe_mv

          safe_mv /usr/share/dotnet         "$TRASH_DIR"/1  &
          safe_mv /usr/local/lib/android    "$TRASH_DIR"/2  &
          safe_mv /opt/ghc                  "$TRASH_DIR"/3  &
          safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR"/4 &
          safe_mv /usr/local/aws-sam-cli    "$TRASH_DIR"/5  &
          safe_mv /usr/local/share/chromium "$TRASH_DIR"/6  &
          safe_mv /usr/local/share/powershell "$TRASH_DIR"/7 &
          safe_mv /usr/local/lib/heroku     "$TRASH_DIR"/8  &
          safe_mv /usr/local/lib/node_modules "$TRASH_DIR"/9 &
          safe_mv /opt/az                   "$TRASH_DIR"/10 &
          safe_mv /opt/microsoft/powershell "$TRASH_DIR"/11 &
          safe_mv /opt/hostedtoolcache/go   "$TRASH_DIR"/12 &
          safe_mv /opt/hostedtoolcache/PyPy "$TRASH_DIR"/13 &
          safe_mv /opt/hostedtoolcache/node "$TRASH_DIR"/14 &
          sudo bash -c "mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
            /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube \
            /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam \
            /usr/local/bin/stack /usr/local/bin/terraform /usr/local/bin/oc \
            $TRASH_DIR/15 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/julia* $TRASH_DIR/16 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/bin/pulumi* $TRASH_DIR/17 2>/dev/null || true" &
          wait

          # 后台低优先级删除，顺带清理浏览器包和 apt 缓存
          (
            sudo nice -n 19 ionice -c 3 rm -rf "$TRASH_DIR"
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable \
              >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            command -v docker >/dev/null 2>&1 && \
              docker rmi $(docker images -q) 2>/dev/null || true
          ) >/dev/null 2>&1 &
          disown

      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 初始化构建环境
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          LEGACY_SUKISU_CONFIG=""
          case "${{ inputs.ksu_variant }}" in
            SukiSU\(*\)) LEGACY_SUKISU_CONFIG="$GITHUB_WORKSPACE/config/${{ inputs.ksu_variant }}.config" ;;
          esac

          if [ -n "$LEGACY_SUKISU_CONFIG" ] && [ ! -f "$LEGACY_SUKISU_CONFIG" ]; then
            echo "未找到 ${{ inputs.ksu_variant }} 固定提交配置: $LEGACY_SUKISU_CONFIG" >&2
            exit 1
          fi

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          LEGACY_SUKISU_CONFIG=$LEGACY_SUKISU_CONFIG
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          # storage.googleapis.com 偶发 TLS 握手失败（curl 退出码 35），全量构建 80+ 个
          # job 各跑一次，累积下来命中概率不低。--retry-all-errors 才会重试握手类错误，
          # -f 保证 HTTP 错误页不会被当成成功写进 repo 文件。
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: 显示配置信息
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "加载配置文件: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi
          if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
            echo "加载老版 SukiSU 固定提交配置: $LEGACY_SUKISU_CONFIG"
            cat "$LEGACY_SUKISU_CONFIG"
          fi

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 恢复 ccache 缓存
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # 仅 6.1+ 走 bazel 构建，持久化 --disk_cache 目录以加速后续构建
      - name: 恢复 bazel 磁盘缓存
        if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      - name: 生成签名密钥
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: 克隆依赖仓库
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "克隆 AnyKernel3..."
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "检查仓库内置 SUSFS 补丁 (susfs4ksu/)..."
          # 自包含: 仓库内已 vendored susfs4ksu (见 susfs4ksu/SOURCE.txt), 优先使用, 不再联网克隆
          if [ -d "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches" ]; then
            echo "使用仓库内置 SUSFS: $(sed -n 's/^commit=//p' "$GITHUB_WORKSPACE/susfs4ksu/SOURCE.txt" 2>/dev/null | head -1)"
          else
            echo "内置补丁缺失 → 克隆 SUSFS (分支: $SUSFS_BRANCH)..."
            if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
              git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
            elif [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
              if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
                echo "ShirkNeko 仓库未找到分支 $SUSFS_BRANCH，回退到 simonpunk 原版..."
                git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
              fi
            else
              git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
            fi
          fi

          # 仅在联网克隆(susfs4ksu 是 git 仓库)时才做提交 pin; 内置快照已固定在 SOURCE.txt
          if [ -d susfs4ksu/.git ]; then
            if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
              SUSFS_FIXED_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$LEGACY_SUKISU_CONFIG" | cut -d'=' -f2-)
              if [ -z "$SUSFS_FIXED_COMMIT" ]; then
                echo "未在 $LEGACY_SUKISU_CONFIG 配置 $SUSFS_BRANCH 的固定 SUSFS 提交" >&2
                exit 1
              fi
              echo "${{ inputs.ksu_variant }} 固定 SUSFS 提交: $SUSFS_FIXED_COMMIT"
              git -C susfs4ksu checkout "$SUSFS_FIXED_COMMIT"
            fi

            CONFIG_FILE="config/config"
            if [ -z "$LEGACY_SUKISU_CONFIG" ] && [ -f "$CONFIG_FILE" ]; then
              CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ "$CUSTOM_ENABLED" == "true" ]; then
                CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
                if [ -n "$CUSTOM_COMMIT" ]; then
                  echo "切换 SUSFS 到自定义提交: $CUSTOM_COMMIT"
                  cd susfs4ksu
                  git checkout "$CUSTOM_COMMIT"
                  cd ..
                fi
              fi
            fi
          fi

          if [ -d susfs4ksu/.git ]; then
            SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          else
            SUSFS_LATEST_COMMIT_DATE=$(sed -n 's/^date=//p' "$GITHUB_WORKSPACE/susfs4ksu/SOURCE.txt" 2>/dev/null | head -1)
            SUSFS_LATEST_COMMIT_DATE="${SUSFS_LATEST_COMMIT_DATE:-内置快照}"
          fi
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS 仓库最新提交日期: $SUSFS_LATEST_COMMIT_DATE"

          echo "准备补丁资源..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "使用当前仓库补丁目录: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      - name: 初始化并同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          MAX_ATTEMPTS=3
          RETRY_DELAY=15
          SYNC_TIMEOUT=15m

          # android.googlesource.com 偶发限流、连接重置或单个 project 拉取卡死，
          # 单次失败不代表分支有问题，整轮重来通常就能成功。
          init_repo() {
            $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --repo-rev=v2.16 || return 1

            # ls-remote 同样可能瞬时失败；失败时返回空会让弃用分支判定出错，
            # 因此按退出码重试，全部失败就让本轮重来而不是白跑一次 sync。
            local ok=false
            for _ in 1 2 3; do
              if REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}); then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "git ls-remote 查询 ${FORMATTED_BRANCH} 失败"
              return 1
            fi

            DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
            TAG_FALLBACK=""
            if grep -q deprecated <<< "$REMOTE_BRANCH"; then
              echo "检测到已弃用的分支: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
            elif [ -z "$REMOTE_BRANCH" ]; then
              # Google 会把过期的月度分支整个删掉（既不在活跃也不在 deprecated/ 下），
              # 但 manifest 仍指向该分支。发布 tag 不会被删，回退到编号最大的 _rN tag。
              # 必须写成 refs/tags/ 全路径，裸 tag 名会被 repo 当成分支去 refs/heads/ 下找。
              local latest_tag
              latest_tag=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null \
                | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' \
                | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -z "$latest_tag" ]; then
                echo "::error::分支 ${FORMATTED_BRANCH} 在上游既无分支也无发布 tag"
                return 1
              fi
              echo "分支 ${FORMATTED_BRANCH} 已被上游删除，回退到发布 tag: $latest_tag"
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${latest_tag}\"|" $DEFAULT_MANIFEST_PATH
              TAG_FALLBACK="$latest_tag"
            fi

            # ★ 外部内核树覆盖(可选): 用厂商 fork 的 common 替换 AOSP ACK 项目。
            #   背景: 原厂模块导入了 17 个纯 ACK 树没有或未导出的私有符号
            #   (scsi_execute_cmd_len / wait_spam_info / mem_cgroup_id_put2 / reclaim_pages /
            #    pm_system_irq_wakeup + 12 个 __tracepoint_android_vh_* 厂商 hook),
            #   这些属于 GKI 保证之外, 只有厂商 fork 里才有 → 必须用同源树构建。
            if [ -n "${{ inputs.kernel_repo }}" ] && [ -n "${{ inputs.kernel_branch }}" ]; then
              echo "使用外部内核树替换 common: ${{ inputs.kernel_repo }} @ ${{ inputs.kernel_branch }}"
              if ! python3 "$GITHUB_WORKSPACE/tools/override_manifest_common.py" "$DEFAULT_MANIFEST_PATH" \
                     --repo "${{ inputs.kernel_repo }}" --branch "${{ inputs.kernel_branch }}"; then
                echo "::error::替换 common 项目失败"
                return 1
              fi
              KERNEL_SOURCE_OVERRIDE="${{ inputs.kernel_repo }}@${{ inputs.kernel_branch }}"
            fi
          }

          attempt=1
          while :; do
            echo "第 $attempt/$MAX_ATTEMPTS 次初始化并同步，分支: common-${FORMATTED_BRANCH}（单次超时 $SYNC_TIMEOUT）"
            df -h "$PWD" | tail -n +2 || true

            rc=0
            if init_repo; then
              # 不加 --fail-fast：单个 project 出错时让其余 project 继续拉完，
              # 重试只需要补齐缺失部分。-j4 与 --no-clone-bundle 是为了避免
              # 高并发触发限流、以及跳过经常超时的 clone.bundle。
              SYNC_FLAGS="-c -j4 --jobs-checkout=4 --no-tags --no-clone-bundle --retry-fetches=3"
              # 第二次在原地续传（repo sync 可断点续传），第三次才整目录重来
              [ "$attempt" -gt 1 ] && SYNC_FLAGS="$SYNC_FLAGS --force-sync"
              timeout -k 60 "$SYNC_TIMEOUT" $REPO sync $SYNC_FLAGS || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "内核源码同步成功（第 $attempt 次）"
                break
              fi
              if [ "$rc" -eq 124 ]; then
                echo "repo sync 超时（$SYNC_TIMEOUT）"
              else
                echo "repo sync 失败，退出码 $rc"
              fi
            else
              rc=1
              echo "repo init 或分支预检失败"
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::内核源码同步连续 $MAX_ATTEMPTS 次失败"
              exit "$rc"
            fi

            # 最后一次重试前彻底清空：只删 .repo 会残留半检出的 project 目录，
            # 之后每次 sync 都会以 "Checking out local projects failed" 收场。
            if [ "$attempt" -eq $((MAX_ATTEMPTS - 1)) ]; then
              echo "清空工作目录后重来"
              find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            echo "${RETRY_DELAY}s 后重试..."
            sleep "$RETRY_DELAY"
            attempt=$((attempt + 1))
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
          echo "TAG_FALLBACK=$TAG_FALLBACK" >> $GITHUB_ENV

          # 记录"实际检出的内核源码版本" —— 排查 KMI/CRC 差异时, 必须先知道构建的是哪个提交。
          # (此前多次判断缺少这一环: 只能从版本串 g<sha> 反推, 容易误判)
          {
            echo "manifest_branch=common-${FORMATTED_BRANCH}"
            echo "source_override=${KERNEL_SOURCE_OVERRIDE:-<无, 用 AOSP ACK>}"
            echo "REMOTE_BRANCH=${REMOTE_BRANCH:-<空>}"
            echo "TAG_FALLBACK=${TAG_FALLBACK:-<无>}"
            echo "common_head=$(git -C "$KERNEL_ROOT/common" rev-parse HEAD 2>/dev/null || echo '?')"
            echo "common_describe=$(git -C "$KERNEL_ROOT/common" describe --tags --always --dirty 2>/dev/null || echo '?')"
            git -C "$KERNEL_ROOT/common" log -1 --format='common_commit_date=%ad%ncommon_subject=%s' 2>/dev/null || true
            echo "--- manifest 里的 common 项目 ---"
            grep -B1 -A3 'name="common"' "$KERNEL_ROOT/.repo/manifests/default.xml" 2>/dev/null | head -14 || true
            echo "--- KMI/LOCALVERSION 常量 ---"
            grep -hE 'KMI_GENERATION|LOCALVERSION|KERNEL_VERSION' \
              "$KERNEL_ROOT/common/build.config.constants" "$KERNEL_ROOT/common/build.config" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/source_revision.txt" 2>&1
          cat "$GITHUB_WORKSPACE/source_revision.txt"

      - name: 应用 Stock Config 伪装
        run: |
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          if [ ! -f "$STOCK_SRC" ]; then
            echo "未检测到 $STOCK_SRC，跳过 Stock Config 伪装。"
            exit 0
          fi

          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "已复制 stock_defconfig -> $STOCK_DST"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::未找到 $TARGET_MAKEFILE"
            exit 1
          fi

          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data 规则已是 stock_defconfig，跳过。"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "已替换 config_data 规则: $TARGET_MAKEFILE"
          else
            echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
            exit 1
          fi

      - name: 提取实际子版本号
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "实际子版本号: $ACTUAL_SUBLEVEL"

      # 以同步后的实际 SUBLEVEL 判断，避免对已包含上游修复的 LTS 重复打补丁
      - name: 自动应用 CVE-2026-43499 rtmutex 修复链
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "${{ inputs.kernel_version }}" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"

      - name: 修复 glibc 2.38 兼容性
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="${{ inputs.sub_level }}"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "应用 glibc 2.38 兼容性修复..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      - name: 添加一加 8E 处理器支持
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "准备 hmbird (一加 8E) 补丁..."
          if [ -f "$GITHUB_WORKSPACE/hmbird_patch.c" ]; then
            cp "$GITHUB_WORKSPACE/hmbird_patch.c" hmbird_patch.c
            echo "使用仓库内置 hmbird_patch.c"
          else
            curl -LSs "https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          fi
          echo "obj-y += hmbird_patch.o" >> Makefile

      - name: 确定 KernelSU 分支
        id: ksu-branch
        if: inputs.ksu_mode != '禁用KSU'
        run: |
          variant_input="${{ inputs.ksu_variant }}"

          case "$variant_input" in
            "Official"|"ReSukiSU")
              BRANCH="-s main"
              ;;
            "SukiSU")
              if [ "${{ inputs.enable_susfs }}" = "false" ]; then
                BRANCH="-s main"
              else
                BRANCH="-s builtin"
              fi
              ;;
            "Next")
              BRANCH=""
              ;;
            *)
              if [ -z "$LEGACY_SUKISU_CONFIG" ] || [ ! -f "$LEGACY_SUKISU_CONFIG" ]; then
                echo "未知变体: $variant_input" >&2
                exit 1
              fi
              SUKISU_FIXED_COMMIT=$(grep "^sukisu=" "$LEGACY_SUKISU_CONFIG" | cut -d'=' -f2-)
              if [ -z "$SUKISU_FIXED_COMMIT" ]; then
                echo "未在 $LEGACY_SUKISU_CONFIG 配置 SukiSU 固定提交" >&2
                exit 1
              fi
              BRANCH="-s $SUKISU_FIXED_COMMIT"
              ;;
          esac

          # 检查自定义提交 (仅对 SukiSU 生效)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU 使用自定义提交: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU 分支: $BRANCH"

      - name: 添加 KernelSU
        if: inputs.ksu_mode != '禁用KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          case "${{ inputs.ksu_variant }}" in
            "Official")
              echo "添加 KernelSU 官方版..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash $BRANCH

              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
              fi
              cd ..
              ;;
            "Next")
              echo "添加 KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev_susfs
              ;;
            "SukiSU")
              echo "添加 SukiSU (FengFaQ/SukiSU-Ultra-fork, 官方手动集成法)..."
              # builtin 分支 = susfs 内置版; 关闭 SUSFS 时用 main
              SUKISU_REF="builtin"
              if [ "${{ inputs.enable_susfs }}" = "false" ]; then
                SUKISU_REF="main"
              fi
              git clone --depth 1 -b "$SUKISU_REF" https://github.com/FengFaQ/SukiSU-Ultra-fork.git KernelSU
              ln -sf "$(realpath --relative-to=common/drivers KernelSU/kernel)" common/drivers/kernelsu
              grep -q "kernelsu" common/drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> common/drivers/Makefile
              grep -q "drivers/kernelsu/Kconfig" common/drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
              ;;
            "ReSukiSU")
              # 自包含: 仓库内已 vendored ReSukiSU 源码 (kernelsu/, 元数据见 kernelsu/SOURCE.txt)
              # 其 kernel/Kbuild 要求存在 ../.git(submodule 检查) 且用 git 生成版本号 →
              # 在 CI 工作区就地 git init 一个最小仓库(只在本次运行有效, 不进我们的 git 历史)
              if [ -d "$GITHUB_WORKSPACE/kernelsu/kernel" ]; then
                echo "添加 ReSukiSU (仓库内置 kernelsu/, 手动集成法)..."
                KSU_SRC="$GITHUB_WORKSPACE/kernelsu"
                if [ ! -e "$KSU_SRC/.git" ]; then
                  (
                    cd "$KSU_SRC"
                    git init -q -b main
                    git config user.email "ci@meizu21gki.local"
                    git config user.name "MEIZU21GKI CI"
                    git add -A
                    git commit -q -m "vendored ReSukiSU snapshot ($(sed -n 's/^commit=//p' SOURCE.txt | head -1))"
                    git tag v4.1.0
                  )
                  echo "内置源码已初始化为工作区本地 git 仓库(Kbuild 的版本号/submodule 检查需要)"
                fi
                ln -sfn "$KSU_SRC/kernel" common/drivers/kernelsu
                # 保险: 上游把 kernel/include/uapi 和 manager/app/src/main/cpp/uapi 做成 symlink 指向根 uapi/,
                # 在 Windows 上检出/拷贝时会退化成"内容是相对路径的小文本文件" → 编译时
                # policy/app_profile.h 找不到 "uapi/app_profile.h"。这里就地还原成 symlink。
                for _link in "$KSU_SRC/kernel/include/uapi" "$KSU_SRC/manager/app/src/main/cpp/uapi"; do
                  if [ -f "$_link" ] && [ ! -d "$_link" ]; then
                    _target=$(cat "$_link")
                    if [ -d "$KSU_SRC/uapi" ]; then
                      rm -f "$_link" && ln -sfn "$_target" "$_link" \
                        && echo "已还原 symlink: $_link -> $_target"
                    fi
                  fi
                done
                grep -q "kernelsu" common/drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> common/drivers/Makefile
                grep -q "drivers/kernelsu/Kconfig" common/drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
                echo "KSU_SRC_DIR=$KSU_SRC" >> $GITHUB_ENV
              else
                echo "内置源码缺失 → 回退 ReSukiSU 官方 setup.sh..."
                curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash $BRANCH
              fi
              ;;
            *)
              if [ -z "$LEGACY_SUKISU_CONFIG" ]; then
                echo "未知变体: ${{ inputs.ksu_variant }}" >&2
                exit 1
              fi
              echo "添加 ${{ inputs.ksu_variant }}..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
          esac

          # KSU 来源可能是: 仓库内置 kernelsu/ (有 SOURCE.txt) 或 联网克隆的 $KERNEL_ROOT/KernelSU (.git)
          KSU_DIR="${KSU_SRC_DIR:-$KERNEL_ROOT/KernelSU}"
          if [ -f "$KSU_DIR/SOURCE.txt" ]; then
            KSU_LATEST_COMMIT_DATE=$(sed -n 's/^date=//p' "$KSU_DIR/SOURCE.txt" | head -1)
          elif [ -d "$KSU_DIR/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C "$KSU_DIR" log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          else
            KSU_LATEST_COMMIT_DATE="未知"
          fi
          echo "KSU_LATEST_COMMIT_DATE=${KSU_LATEST_COMMIT_DATE:-未知}" >> $GITHUB_ENV

      - name: 配置 SukiSU 管理器信息
        if: (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'SukiSU(40726)' || inputs.ksu_variant == 'SukiSU(40548)') && inputs.ksu_mode != '禁用KSU'
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
        run: |
          KBUILD_FILE="./kernel/Kbuild"
          CUSTOM_TAG="${{ vars.MANAGER_STR }}"

          if [ ! -f "$KBUILD_FILE" ]; then
            echo "未找到 $KBUILD_FILE，跳过 SukiSU 版本标识定制"
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=8 HEAD)
          BRANCH_NAME="${BRANCH#-s }"
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "$BRANCH" ]; then
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
          fi

          if [ -n "$CUSTOM_TAG" ]; then
            VERSION_TEMPLATE="v\$1-$CUSTOM_TAG@$BRANCH_NAME[$GIT_HASH]"
          else
            VERSION_TEMPLATE="v\$1-$GIT_HASH@$BRANCH_NAME"
          fi

          awk -v body="$VERSION_TEMPLATE" '
            BEGIN {
              in_block = 0
              replaced = 0
            }
            /^[[:space:]]*define get_ksu_version_full$/ {
              print
              print body
              in_block = 1
              replaced = 1
              next
            }
            in_block && /^[[:space:]]*endef$/ {
              print
              in_block = 0
              next
            }
            !in_block {
              print
            }
            END {
              if (!replaced) {
                exit 1
              }
            }
          ' "$KBUILD_FILE" > "${KBUILD_FILE}.tmp" && mv "${KBUILD_FILE}.tmp" "$KBUILD_FILE"

          echo "已更新 get_ksu_version_full 模板: $VERSION_TEMPLATE"

      # ==================== SUSFS 集成补丁导出 ====================
      # 仅 SukiSU / ReSukiSU 且启用 SUSFS 时导出，快照用临时索引生成树对象，
      # 不创建提交，避免改变「配置内核名称」读取的 HEAD 哈希
      - name: 记录 SUSFS 基线快照
        if: inputs.export_susfs_patches && inputs.enable_susfs && inputs.ksu_mode != '禁用KSU' && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU')
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 排除 .rej/.orig 和补丁文件本身：apply.sh 会把 SUSFS 补丁拷进 common/ 并留下 .rej
          # 从真实索引复制一份再 add，只需哈希变动文件，避免对整棵内核树重新哈希
          cp "$(git rev-parse --git-path index)" /tmp/susfs-base.idx
          export GIT_INDEX_FILE=/tmp/susfs-base.idx
          git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch'
          SUSFS_BASE_TREE=$(git write-tree)
          echo "SUSFS_BASE_TREE=$SUSFS_BASE_TREE" >> $GITHUB_ENV
          echo "SUSFS_PATCH_EXPORT=true" >> $GITHUB_ENV
          echo "基线树对象: $SUSFS_BASE_TREE"

      - name: 应用 SUSFS 补丁
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
        run: bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"

      - name: 生成 SUSFS 集成补丁
        if: env.SUSFS_PATCH_EXPORT == 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        env:
          OUT_DIR: ${{ github.workspace }}/susfs-patch
        run: |
          export_susfs_patch() {
            cp /tmp/susfs-base.idx /tmp/susfs-after.idx || return 1
            export GIT_INDEX_FILE=/tmp/susfs-after.idx
            git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch' || return 1
            local after_tree
            after_tree=$(git write-tree) || return 1
            unset GIT_INDEX_FILE

            mkdir -p "$OUT_DIR"
            git diff --binary "$SUSFS_BASE_TREE" "$after_tree" > "$OUT_DIR/susfs.patch" || return 1
            if [ ! -s "$OUT_DIR/susfs.patch" ]; then
              echo "补丁内容为空"
              return 1
            fi
            # 反向试打，证明补丁与当前工作树完全一致
            git apply --check -R "$OUT_DIR/susfs.patch" || return 1

            local formatted_branch gki_branch gki_commit
            formatted_branch="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
            gki_branch="$formatted_branch"
            grep -q deprecated <<< "$REMOTE_BRANCH" && gki_branch="deprecated/$formatted_branch"
            # 分支已被上游删除时，实际检出的是发布 tag
            [ -n "$TAG_FALLBACK" ] && gki_branch="refs/tags/$TAG_FALLBACK"
            gki_commit=$(git rev-parse HEAD)

            # KSU 与 SUSFS 提交都取本次构建实际用的来源(内置快照读 SOURCE.txt, 联网克隆读 git)
            local ksu_repo ksu_commit ksu_slug ksu_setup_cmd ksu_dir
            ksu_dir="${KSU_SRC_DIR:-$KERNEL_ROOT/KernelSU}"
            if [ -f "$ksu_dir/SOURCE.txt" ]; then
              ksu_repo=$(sed -n 's/^repo=//p' "$ksu_dir/SOURCE.txt" | head -1)
              ksu_commit=$(sed -n 's/^commit=//p' "$ksu_dir/SOURCE.txt" | head -1)
            elif [ -d "$ksu_dir/.git" ]; then
              ksu_repo=$(git -C "$ksu_dir" remote get-url origin | sed 's/\.git$//')
              ksu_commit=$(git -C "$ksu_dir" rev-parse HEAD)
            fi
            ksu_repo=${ksu_repo:-unknown}
            ksu_commit=${ksu_commit:-unknown}
            ksu_slug=${ksu_repo#https://github.com/}
            ksu_setup_cmd="curl -LSs https://raw.githubusercontent.com/$ksu_slug/main/kernel/setup.sh | bash -s $ksu_commit"

            local susfs_repo susfs_branch susfs_commit
            if [ -f "$SUSFS4KSU/SOURCE.txt" ]; then
              susfs_repo=$(sed -n 's/^repo=//p' "$SUSFS4KSU/SOURCE.txt" | head -1)
              susfs_commit=$(sed -n 's/^commit=//p' "$SUSFS4KSU/SOURCE.txt" | head -1)
            elif [ -d "$SUSFS4KSU/.git" ]; then
              susfs_repo=$(git -C "$SUSFS4KSU" remote get-url origin | sed 's/\.git$//')
              susfs_commit=$(git -C "$SUSFS4KSU" rev-parse HEAD)
            fi
            susfs_repo=${susfs_repo:-unknown}
            susfs_commit=${susfs_commit:-unknown}
            susfs_branch="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

            local rej_count patch_sha256
            # 上游自带且未改动的 .rej（如 android15-6.6-2026-04 的 mm/rmap.c.rej）不算冲突；
            # patch 失败会覆盖同名文件，所以被改动过的仍要计入
            rej_count=$(comm -23 \
              <(find . -type f -name '*.rej' | sed 's|^\./||' | sort) \
              <(git ls-files -- '*.rej' | while IFS= read -r f; do git diff --quiet -- "$f" && echo "$f"; done | sort) | wc -l)
            patch_sha256=$(sha256sum "$OUT_DIR/susfs.patch" | awk '{print $1}')

            jq -n \
              --arg android_version "${{ inputs.android_version }}" \
              --arg kernel_version "${{ inputs.kernel_version }}" \
              --arg sub_level "${{ inputs.sub_level }}" \
              --arg actual_sublevel "$ACTUAL_SUBLEVEL" \
              --arg os_patch_level "${{ inputs.os_patch_level }}" \
              --arg gki_branch "$gki_branch" \
              --arg gki_commit "$gki_commit" \
              --arg ksu_variant "${{ inputs.ksu_variant }}" \
              --arg ksu_repo "$ksu_repo" \
              --arg ksu_commit "$ksu_commit" \
              --arg ksu_setup_cmd "$ksu_setup_cmd" \
              --arg susfs_repo "$susfs_repo" \
              --arg susfs_branch "$susfs_branch" \
              --arg susfs_commit "$susfs_commit" \
              --argjson rej_count "$rej_count" \
              --arg patch_sha256 "$patch_sha256" \
              --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg run_id "$GITHUB_RUN_ID" \
              '$ARGS.named' > "$OUT_DIR/manifest.json" || return 1

            echo "补丁大小: $(du -h "$OUT_DIR/susfs.patch" | cut -f1)，.rej 数量: $rej_count"
            cat "$OUT_DIR/manifest.json"
          }

          if ! export_susfs_patch; then
            echo "::warning::SUSFS 集成补丁导出失败，本次构建不上传补丁"
            rm -rf "$OUT_DIR"
            echo "SUSFS_PATCH_EXPORT=false" >> $GITHUB_ENV
          fi

      - name: 克隆 Droidspaces 补丁仓库
        if: inputs.droidspaces != 'off'
        run: |
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV

      - name: 备份基准 defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: 集成 NoMount 挂载元模块
        if: inputs.use_nomount
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # NoMount 是挂载元模块，在 fs/ 目录注册子系统，与 SUSFS sus_mount 不冲突，可与任意 KSU 变体共存。
          # 必须在「生成 SUSFS 集成补丁」之后运行，避免 NoMount 改动被计入 susfs.patch；
          # 且在「备份基准 defconfig」之后追加 CONFIG，确保 6.1+ 的 bazel fragment diff 能捕获 CONFIG_NOMOUNT。
          set -euo pipefail
          # 拉取 NoMount 内核集成脚本（dev 分支最新提交），脚本会克隆仓库、建立 fs/nomount 软链接并注册 Kconfig/Makefile（内部含幂等守卫）
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

          if [ ! -L "fs/nomount" ]; then
            echo "::error::NoMount 集成失败：fs/nomount 软链接缺失"
            exit 1
          fi
          echo "NoMount 集成完成，commit: $(git -C NoMount rev-parse HEAD)"

          # 启用 NoMount defconfig（幂等）
          if ! grep -q '^CONFIG_NOMOUNT=y' "$DEFCONFIG"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG"
            echo "已启用 CONFIG_NOMOUNT=y"
          else
            echo "CONFIG_NOMOUNT=y 已存在，跳过"
          fi

      - name: 集成 Droidspaces 支持
        if: inputs.droidspaces != 'off'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="${{ inputs.kernel_version }}"
          SLOT="${{ inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "应用 Droidspaces SYSVIPC kABI 修复补丁 (槽位: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: 未适配的内核版本 $KERNEL_VER，跳过补丁"
              exit 0
              ;;
          esac
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::SYSVIPC kABI 补丁应用失败，可能已应用或上下文不匹配"
          fi

          # 5.10 及以下还需要 POSIX_MQUEUE 的 kABI 修复
          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "应用 Droidspaces POSIX_MQUEUE kABI 修复补丁 (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::POSIX_MQUEUE kABI 补丁应用失败，可能已应用或上下文不匹配"
            fi
          fi

          # Android 16 / 6.12 的 rust_binder.ko 在启用 IPC_NS 后会引用
          # init_ipc_ns 与 put_ipc_ns，但当前 AOSP common 分支尚未导出这两个符号。
          # 这里补齐导出，避免 modpost 因 undefined symbol 失败。
          if [ "$KERNEL_VER" = "6.12" ]; then
            if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
              sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
              echo "已为 init_ipc_ns 补充符号导出"
            fi

            if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
              sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
              echo "已为 put_ipc_ns 补充符号导出"
            fi
          fi

          echo "添加 Droidspaces 内核配置..."
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  已启用: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  已切换: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  已添加: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  当前内核未定义: $cfg，跳过"
            fi
          }

          # 必要配置
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS

          # 用户命名空间：上游文档列为可选但推荐，用于修复 docker unsafe procfs 报错。
          # init/Kconfig 中无 depends on，且 struct cred 的 user_ns/ucounts 是无条件成员，
          # task_struct 等结构体不含 CONFIG_USER_NS 条件编译，因此不影响 kABI 布局，
          # 不需要像 SYSVIPC/IPC_NS 那样额外打 padding 补丁。与 wild_kernel 保持一致，全版本启用。
          enable_config CONFIG_USER_NS

          # 可选: 网络相关配置 (Docker/NAT 模式)
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET

          # REJECT 目标在不同内核版本上的符号名可能不同，按实际存在的配置启用
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

          echo "Droidspaces 集成完成"

          echo "GKI6.6 普通用户联网专用配置 (Droidspaces)"
          # 专门处理 =n 类型的配置（安卓网络权限必须关闭）
          disable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=n" "$DEFCONFIG"; then
              echo "  已禁用: $cfg"
            elif grep -q "^${cfg}=y" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=y$/${cfg}=n/" "$DEFCONFIG"
              echo "  已关闭: $cfg"
            else
              echo "# ${cfg} is not set" >> "$DEFCONFIG"
              echo "  已添加并禁用: $cfg"
            fi
          }

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            # 关闭安卓严格网络控制，否则容器内普通用户无法联网
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

      - name: 注入 NTSync 内核配置
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== 开始注入 NTSync 内核补丁 ==="
          echo "Android 版本: ${{ inputs.android_version }}"
          echo "Kernel 版本: ${{ inputs.kernel_version }}"

          case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "::warning::NTSync: 未适配 ${{ inputs.android_version }} / ${{ inputs.kernel_version }}，跳过补丁"
              exit 0
              ;;
          esac

          echo "自动选择 NTSync 补丁: ${NTSYNC_PATCH}.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_base.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/${NTSYNC_PATCH}.patch"

          patch -p1 < "ntsync_base.patch"
          patch -p1 < "${NTSYNC_PATCH}.patch"

          cd ..

          CONFIG_PATH="./common/arch/arm64/configs/gki_defconfig"
          echo "正在检查并启用 CONFIG_NTSYNC..."

          # 移除未启用标记，再追加启用项，保证重复运行时保持幂等。
          sed -i '/CONFIG_NTSYNC is not set/d' "$CONFIG_PATH"
          if ! grep -q "^CONFIG_NTSYNC=y" "$CONFIG_PATH"; then
            echo "CONFIG_NTSYNC=y" >> "$CONFIG_PATH"
            echo "✅ 已成功启用 CONFIG_NTSYNC"
          else
            echo "✅ CONFIG_NTSYNC 已处于启用状态"
          fi

          echo "=== NTSync 补丁与配置注入完成 ==="

      - name: 应用 Unicode 绕过修复
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 上游 2023-11、2024-01、2024-03 月度分支已带有 "unicode: Don't special case ignorable code points"，
          # patch --forward 会判定为已应用并跳过，但被忽略的 hunk 仍会写成 .rej，先做幂等检查
          if [ -f fs/unicode/mkutf8data.c ] && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "源码已包含 Unicode 绕过修复，跳过补丁"
            exit 0
          fi
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      - name: 配置 ZRAM LZ4 补丁栈
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "升级 LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch 应用失败，可能已应用或上下文不匹配"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch 应用失败，可能已应用或上下文不匹配"
          fi

      - name: 修复 6.6 WiFi/蓝牙兼容性（三星 + 小米）
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::文件不存在: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::补丁不存在: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "min_kdp symbols patch 已应用或当前上下文不匹配，跳过。"
          fi

          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::文件不存在: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      - name: 配置 ZRAM 选项
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi

      - name: 添加 BBG 防格机补丁
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: 应用网络增强（BBRv3 / IPSet / Qdisc / CIFS）
        if: inputs.use_networking
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
          KVER="${{ inputs.kernel_version }}"
          AVER="${{ inputs.android_version }}"

          # ---------- BBRv3 补丁：按版本分派（来自 WildKernels/kernel_patches） ----------
          case "$AVER-$KVER" in
            android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
            android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
            android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
            android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
            *) BBR3_PATCH="" ;;
          esac

          # android16-6.12 的 backport 补丁上游不可用（wild_kernel 已禁用），仅保留基线 BBR v1
          if [ -n "$BBR3_PATCH" ]; then
            if [ ! -f "$BBR3_PATCH" ]; then
              echo "::error::BBRv3 补丁不存在: $BBR3_PATCH" >&2
              exit 1
            fi
            if patch -p1 --dry-run < "$BBR3_PATCH" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
              echo "[+] BBRv3 补丁已应用"
            else
              echo "::error::BBRv3 补丁应用失败，保留 .rej 供汇总产物分析" >&2
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH" || true
              exit 1
            fi
          else
            echo "[*] $AVER-$KVER 无 BBRv3 backport，跳过补丁"
          fi

          # 5.10 缺少 proc_dou8vec_minmax（BBRv3 依赖的 5.15+ sysctl API），补两个前置补丁
          if [ "$KVER" = "5.10" ] && ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h 2>/dev/null; then
            for prepatch in sysctl_add_proc_dou8vec_minmax sysctl_fix_data-races_in_proc_dou8vec_minmax; do
              if patch -p1 --dry-run < "$BBR3_DIR/$prepatch.patch" >/dev/null 2>&1; then
                patch -p1 --no-backup-if-mismatch < "$BBR3_DIR/$prepatch.patch"
              else
                echo "::error::5.10 sysctl 前置补丁应用失败: $prepatch" >&2
                exit 1
              fi
            done
            echo "[+] 5.10 sysctl 前置补丁已应用"
          fi

          set_config() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }

          # IPSet 全家桶 + netfilter 联动（各版本 Kconfig 均已验证存在）
          for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
            IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
            IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
            NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
            NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            set_config "CONFIG_$cfg" y
          done
          set_config CONFIG_IP_SET_MAX 65534

          # TCP 拥塞控制算法：已打 BBRv3 补丁的版本默认 bbr3，其余默认 bbr
          for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
            TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
            set_config "CONFIG_$cfg" y
          done
          if [ -n "$BBR3_PATCH" ]; then
            set_config CONFIG_TCP_CONG_BBR3 y
            set_config CONFIG_DEFAULT_BBR3 y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
          else
            set_config CONFIG_DEFAULT_BBR y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
          fi

          # 流量整形 Qdisc + 连接标记 + TTL/HopLimit + WireGuard
          for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
            IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
            set_config "CONFIG_$cfg" y
          done

          # CIFS 网络文件系统（NETFS_SUPPORT 为隐藏符号，由 Kconfig 按需选中）
          for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
            set_config "CONFIG_$cfg" y
          done

          # 6.12 的 NETFS 内置化后需移除 modules.bzl 的模块条目，否则打包失败
          if [ "$AVER" = "android16" ] && grep -q '"fs/netfs/netfs.ko",' modules.bzl 2>/dev/null; then
            sed -i '/"fs\/netfs\/netfs\.ko",/d' modules.bzl
          fi

          echo "[+] 网络增强配置完成"

      - name: 应用 Re-Kernel
        if: inputs.use_rekernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          echo "Integrating Re-Kernel..."
          TMP_REKERNEL=/tmp/rekernel
          rm -rf "$TMP_REKERNEL"
          git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

          # 同步上游拆分后的完整驱动源码
          rm -rf common/drivers/rekernel
          mkdir -p common/drivers/rekernel
          cp -a "$TMP_REKERNEL/LKM-Source/." common/drivers/rekernel/

          # 将上游外置模块配置适配为内核内置驱动
          REKERNEL_MAKEFILE="common/drivers/rekernel/Makefile"
          sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
          grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
            echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
          sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' common/drivers/rekernel/Kconfig

          # 挂载到驱动树
          if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
            sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
          fi
          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
            echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
          fi

          # 修正头文件包含路径（适配 in-tree 编译）
          sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
          # 补齐 5.10 binder_internal.h 使用 DEFINE_SHOW_ATTRIBUTE 所需的定义
          grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
            sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c

          # 配置 defconfig（幂等）
          grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"

      - name: 配置内核选项
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          # ★ TMPFS_XATTR / TMPFS_POSIX_ACL 是 KernelSU 需要的(KSU 的模块挂载依赖 tmpfs xattr),
          #   原厂内核没有 KSU 所以能关, 我们不能关; 而且这两项与 KMI 无关(只影响 shmem 内部结构,
          #   不动 PG_* 位序, 也不动 struct mm_struct)。
          #   ⚠ 一旦这里写了这两个符号, meizu21.yml 的 extra_config 里就【不能】再写相反的声明 ——
          #   fragment 是 "diff gki_defconfig.orig gki_defconfig | grep '^>'" 生成的, 同符号两条
          #   相反声明会让 kleaf 的 fragment 校验判定自相矛盾而编译失败(实测 run 15)。
          #   tools/verify_meizu21gki.py 里有对应的静态检查。
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          # 禁用KSU 时源码里没有 KernelSU，CONFIG_KSU 不存在，写入会被 bazel 的 defconfig 检查拒绝
          if [ "${{ inputs.ksu_mode }}" != "禁用KSU" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          fi

          if [ "${{ inputs.ksu_mode }}" != "禁用KSU" ] && { [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "SukiSU(40726)" ] || [ "${{ inputs.ksu_variant }}" == "SukiSU(40548)" ] || [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.ksu_variant }}" == "Next" ]; }; then
            if [[ "${{ inputs.use_kpm }}" == enabled* ]] || [[ "${{ inputs.use_kpm }}" == patched* ]]; then
              if ! grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' common KernelSU 2>/dev/null; then
                echo "错误: 已请求启用 KPM，但当前 KernelSU 代码未声明 CONFIG_KPM" >&2
                exit 1
              fi
              echo "CONFIG_KPM=y" >> "$DEFCONFIG"
            fi
          fi

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_variant }}" == "ReSukiSU" && "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            {
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> "$DEFCONFIG"
            # 修复 5.15.74~5.15.137: kallsyms_on_each_symbol 仅在 LIVEPATCH 下编译，导致 ReSukiSU 链接失败
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "已修复 kallsyms_on_each_symbol 的 LIVEPATCH 编译限制"
            fi
          fi

          # 调用方自定义内核配置(多行,直接 append;会被下面的 fragment 抽取带上)
          if [ -n "${{ inputs.extra_config }}" ]; then
            echo "追加自定义内核配置:"
            printf '%s\n' "${{ inputs.extra_config }}" >> "$DEFCONFIG"
            grep -E '^(CONFIG_[A-Z0-9_]+=|# CONFIG_)' "$DEFCONFIG" | tail -n 20
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 添加 SUSFS 配置
        if: inputs.enable_susfs
        run: |
          LINES_BEFORE=$(wc -l < "$DEFCONFIG")
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          # ★ 2026-10-03: 关闭 SUSFS 调试日志。ENABLE_LOG 会为每次钩子调用做日志输出,
          #   开机期要读几万个文件, 这些逐次调用累积起来是实打实的启动开销。
          #   功能不受影响 —— 它只是日志开关。
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          # 把本步实际追加的行导出为配置片段，随 SUSFS 集成补丁一起分发
          if [ "$SUSFS_PATCH_EXPORT" = "true" ] && [ -d "$GITHUB_WORKSPACE/susfs-patch" ]; then
            tail -n +$((LINES_BEFORE + 1)) "$DEFCONFIG" > "$GITHUB_WORKSPACE/susfs-patch/susfs.config"
            echo "已导出 SUSFS 配置片段: $(wc -l < "$GITHUB_WORKSPACE/susfs-patch/susfs.config") 行"
          fi

      # ★★ 核心修复(2026-10-03): 让内核为 shrink_slab 生成 KCFI 类型哈希 ★★
      #
      # 现象: 开机约 90 秒后画面卡死, 2~3 秒后被看门狗复位重启, 内核日志:
      #   CFI failure at kshrink_slabd_func+0x104/0x16c [mz_kshrink_slabd]
      #     (target: shrink_slab+0x0/0x3a4; expected type: 0xc3b4beac)
      #   Kernel panic - not syncing: Oops - CFI: Fatal exception
      #
      # 根因(已用镜像二进制逐字节验证):
      #   1. /proc/kallsyms 里 shrink_slab 与 shrink_slab [mz_kshrink_slabd] 两条 —— 后者是
      #      模块 BSS 里的函数指针, 说明模块是用 kallsyms_lookup_name() 取到内核函数地址后
      #      【间接调用】的; 只有间接调用点会校验 KCFI 类型哈希。
      #   2. 类型哈希就是函数入口前 4 字节。原厂 Image 里 shrink_slab 入口前 = 0xc3b4beac;
      #      我们构建的 Image 里同位置 = 0xd65f03c0(即 ret, 上一个函数的结尾) → 根本没有哈希。
      #   3. 两个内核里该函数的指令字节完全相同(paciasp; sub sp,sp,#0x2c0; stp x29,x30...),
      #      说明不是原型差异; 对照符号 kfree 的类型哈希两边也完全一致(0x9390bcfa) →
      #      哈希算法没问题, 唯独这一个函数缺哈希。
      #   4. 上游 Linux 6.1 的 mm/vmscan.c 把它写成了 static:
      #        static unsigned long shrink_slab(gfp_t gfp_mask, int nid, ...)
      #      编译器据此认为它无需被间接调用, 于是不生成类型哈希。原厂(QCOM 内核)里它是带声明的
      #      全局函数, 所以有哈希。
      #   ※ 与 LTO 无关: LTO none(run 8) 与 LTO thin(run 14) 的哈希分布逐字节相同。
      #
      # 修复: 去掉 static 并补一条前置原型(CONFIG_WERROR=y 下 -Wmissing-prototypes 会报错),
      #       恢复成与原厂相同的形态 → 类型哈希重新生成, 且原型一致, 值应当就是 0xc3b4beac。
      - name: 修复 shrink_slab 缺失 KCFI 类型哈希 (厂商模块间接调用它)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          VS="./common/mm/vmscan.c"
          [ -f "$VS" ] || { echo "::error::找不到 $VS"; exit 1; }

          echo "--- 修改前 ---"
          grep -n 'shrink_slab' "$VS" | head -8

          if grep -q '^static unsigned long shrink_slab(' "$VS"; then
            sed -i 's/^static unsigned long shrink_slab(/unsigned long shrink_slab(/' "$VS"
            echo "已去掉 shrink_slab 的 static"
          fi
          grep -q '^unsigned long shrink_slab(' "$VS" \
            || { echo "::error::shrink_slab 非 static 化失败, 上游写法可能已变"; exit 1; }

          PROTO='unsigned long shrink_slab(gfp_t gfp_mask, int nid, struct mem_cgroup *memcg, int priority);'
          if ! grep -qF "$PROTO" "$VS"; then
            sed -i "/^unsigned long shrink_slab(gfp_t gfp_mask, int nid,/i $PROTO" "$VS"
            grep -qF "$PROTO" "$VS" \
              || { echo "::error::补 shrink_slab 前置原型失败"; exit 1; }
            echo "已补上 shrink_slab 前置原型"
          fi

          echo "--- 修改后 ---"
          grep -n -A2 'shrink_slab(gfp_t gfp_mask' "$VS" | head -14

      - name: 配置内核名称
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          fi

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          elif [ ! -f "build/build.sh" ]; then
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android14-6.1")  KMI_TAG="android14-11" ;;
              "android15-6.6")  KMI_TAG="android15-8" ;;
              "android16-6.12") KMI_TAG="android16-5" ;;
              *) KMI_TAG="${{ inputs.android_version }}" ;;
            esac

            if [ "${{ inputs.kernel_version }}" = "6.1" ]; then
              KMI_LOCAL="-${KMI_TAG}-g${GHASH}-${BID}-4k"
              sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
              sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
            else
              SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"
              perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' ./scripts/setlocalversion 2>/dev/null || true
            fi
          fi

      - name: 设置自定义构建时间
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=构建时间格式错误::自定义构建时间必须形如 Sun Dec 01 08:10:00 UTC 2024，请删除多余前缀并使用两位日期。"
              exit 1
            fi

            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %d %T UTC %Y' 2>/dev/null || true)"
            if [[ "$NORMALIZED_TIME" != "$INPUT_TIME" ]]; then
              echo "::error title=构建时间无效::自定义构建时间无法解析为真实 UTC 时间，或星期与日期不匹配。"
              exit 1
            fi

            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi

          echo "使用构建时间: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # 统一处理 mkcompile_h 补丁
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "应用 5.x 经典时间戳补丁: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "应用 6.x mkcompile_h 补丁: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi

      # A 方案: 补上"原厂(闭源)内核多导出、AOSP ACK 没有"的私有符号:
      #   scsi_execute_cmd_len(ufs_qcom.ko 首阶段依赖) / reclaim_pages / pm_system_irq_wakeup /
      #   mem_cgroup_id_put2 / wait_spam_info / 12 个 vendor hook(__tracepoint_android_vh_*)
      # 依据: 设备模块 __versions + 模块重定位类型(tools/symbol_ref_kind.py) + 原厂内核 BTF
      # ⚠ 必须独立成步: "编译内核"在容器里执行, 容器内看不到 $GITHUB_WORKSPACE/tools。
      - name: 补原厂私有符号 (A 方案)
        if: hashFiles('device/meizu21/module_kmi_manifest.txt') != ''
        run: |
          set -e
          : "${KERNEL_ROOT:=$GITHUB_WORKSPACE/$CONFIG}"
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          # 输出同时进 build-logs/ —— 失败时会被"提交失败日志"步骤带到 log/ 目录, 便于离线诊断
          python3 "$GITHUB_WORKSPACE/tools/apply_kmi_shim.py" --kernel-root "$KERNEL_ROOT/common" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-logs/apply_kmi_shim.log"
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          git -C "$KERNEL_ROOT/common" diff --stat 2>/dev/null | tail -12 || true

      - name: 编译内核
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # 为 retry 的每次执行生成独立日志
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "编译尝试: $ATTEMPT"
              echo "开始时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
              echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              if [ -f "build/build.sh" ]; then
                # legacy 路径同样遵循 lto_mode(auto = 6.12→none / 其它→thin)
                LEGACY_LTO="${{ inputs.lto_mode }}"
                if [ "$LEGACY_LTO" = "auto" ]; then
                  LEGACY_LTO="thin"
                  if [ "${{ inputs.kernel_version }}" = "6.12" ]; then LEGACY_LTO="none"; fi
                fi
                LTO="$LEGACY_LTO" BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
                strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
              else
                # 提取 gki_defconfig 修改到 fragment，避免 bazel trim 检查失败
                FRAG="common/arch/arm64/configs/ksu.fragment"
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
                cp "$DEFCONFIG.orig" "$DEFCONFIG"
                echo "=== KSU Fragment 内容 ==="
                cat "$FRAG"
                echo "========================="
                FRAG_FLAG=""
                if [ -s "$FRAG" ]; then
                  FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
                fi
                # LTO:auto = 历史行为(6.12 强制 none,其余 thin);显式 none/thin/full 时照传
                if [ "${{ inputs.lto_mode }}" = "auto" ]; then
                  LTO_FLAG="--lto=thin"
                  if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
                    LTO_FLAG="--lto=none"
                  fi
                else
                  LTO_FLAG="--lto=${{ inputs.lto_mode }}"
                fi
                echo "LTO_FLAG=$LTO_FLAG"
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
                strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
              fi

              echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
              echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
              echo "如果日期不同或相差过远则补丁失效、编译失败"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "结束时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "退出码: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: 整理编译失败日志
        if: ${{ failure() }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android 版本: ${{ inputs.android_version }}"
            echo "内核版本: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "安全补丁级别: ${{ inputs.os_patch_level }}"
            echo "KernelSU 变体: ${{ inputs.ksu_variant }}"
            echo "配置名称: ${CONFIG:-未知}"
            echo "Git 提交: $GITHUB_SHA"
            echo "工作流地址: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "编译尝试次数: ${COMPILE_ATTEMPTS:-未知}"
            echo "最终退出码: ${COMPILE_EXIT_CODE:-未知}"
            echo "KSU 提交日期: ${KSU_LATEST_COMMIT_DATE:-未知}"
            echo "SUSFS 提交日期: ${SUSFS_LATEST_COMMIT_DATE:-未知}"
          } > "$LOG_DIR/summary.txt"

          printf '%s\n' "${{ inputs.ksu_variant }}_kernel-${CONFIG}-Build-Logs" > "$LOG_DIR/artifact-name.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: 上传编译失败日志
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      # 需求: 编译报错时把日志自动提交到仓库内的 log/ 目录
      # (触发路径不含 log/**, 提交日志不会再次触发构建; 稀疏克隆只取 log/, 不拉整个仓库)
      - name: 提交失败日志到 log/ 目录
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          BRANCH="${{ github.event.repository.default_branch }}"
          [ -n "$BRANCH" ] || BRANCH="main"
          RUN_DIR="log/${GITHUB_RUN_NUMBER}-run${GITHUB_RUN_ID}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            TARGET="$RUNNER_TEMP/repo-log-$attempt"
            rm -rf "$TARGET"
            if ! git clone -q --depth 1 --filter=blob:none --sparse "$REMOTE" "$TARGET"; then
              echo "克隆失败, 5s 后重试..."
              sleep 5
              continue
            fi
            git -C "$TARGET" sparse-checkout set log
            mkdir -p "$TARGET/$RUN_DIR"

            # 失败可能发生在编译之前的步骤 → 至少写一份可读摘要
            {
              echo "# 构建失败 run ${GITHUB_RUN_NUMBER}"
              echo ""
              echo "- 时间(UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "- 仓库/分支: ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME}"
              echo "- 提交: ${GITHUB_SHA}"
              echo "- 工作流: ${GITHUB_WORKFLOW}"
              echo "- 运行页面: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- 变体/模式: ${{ inputs.ksu_variant }} / ${{ inputs.ksu_mode }} (SUSFS=${{ inputs.enable_susfs }})"
              echo "- GKI: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}"
              echo "- LTO: ${{ inputs.lto_mode }}"
              echo "- extra_config: |"
              printf '%s\n' "${{ inputs.extra_config }}" | sed 's/^/    /'
            } > "$TARGET/$RUN_DIR/README.md"

            cp -r "$GITHUB_WORKSPACE/build-logs"/* "$TARGET/$RUN_DIR/" 2>/dev/null || true
            # 各步骤产出的 TXT 报告也一并带上(补符号/CRC 对齐等在编译前后都可能失败)
            cp -f "$GITHUB_WORKSPACE"/*.txt "$TARGET/$RUN_DIR/" 2>/dev/null || true
            if [ -d "$GITHUB_WORKSPACE/patch-rejects" ]; then
              mkdir -p "$TARGET/$RUN_DIR/patch-rejects"
              cp -r "$GITHUB_WORKSPACE/patch-rejects"/* "$TARGET/$RUN_DIR/patch-rejects/" 2>/dev/null || true
            fi

            git -C "$TARGET" config user.email "action@github.com"
            git -C "$TARGET" config user.name "github-actions[bot]"
            git -C "$TARGET" add log
            if git -C "$TARGET" diff --cached --quiet; then
              echo "无日志变更"
              exit 0
            fi
            git -C "$TARGET" commit -q -m "log: 构建失败 run ${GITHUB_RUN_ID} ($(echo "${GITHUB_SHA}" | cut -c1-8))"
            if git -C "$TARGET" push -q origin "HEAD:$BRANCH"; then
              echo "日志已提交: $BRANCH/$RUN_DIR/"
              exit 0
            fi
            echo "第 $attempt 次推送失败, 5s 后重试..."
            sleep 5
          done
          echo "::warning::日志推送失败(不影响构建结论)"

      # - name: 应用 KPM 补丁 (SukiSU/ReSukiSU/Next)
      #   if: startsWith(inputs.use_kpm, 'patched') && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU' || inputs.ksu_variant == 'Next')
      #   run: |
      #     case "${{ inputs.android_version }}" in
      #       "android12"|"android13")
      #         if [ "${{ inputs.kernel_version }}" != "6.6" ]; then
      #           TARGET_PATH="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
      #         fi
      #         ;;
      #       "android14"|"android15"|"android16")
      #         TARGET_PATH="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/"
      #         ;;
      #     esac

      #     cp -r $SUKISU_PATCHES/kpm/patch_linux "$TARGET_PATH/patch"
      #     cd "$TARGET_PATH"
      #     chmod 777 patch
      #     ./patch
      #     rm -rf Image
      #     mv oImage Image

      # B 方案: 把设备厂商模块 __versions 里期望的符号 CRC 对齐进内核 Image(改 __kcrctab)。
      # 为什么安全: module_layout 本来就一致, 核心结构体布局经 BTF 逐成员对比也一致
      # (tools/btf_diff.py), 差异只是"版本戳"; 对齐后厂商模块可原样加载, 不必改 vendor 分区。
      - name: 符号 CRC 对齐 (B 方案)
        if: hashFiles('device/meizu21/module_kmi_manifest.txt') != ''
        run: |
          set -e
          SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          IMG="$SRC_DIR/Image"
          SV="$SRC_DIR/Module.symvers"
          VM=$(find -L "$KERNEL_ROOT" -maxdepth 6 -name vmlinux -type f 2>/dev/null | head -1)
          echo "Image=$IMG"
          echo "vmlinux=${VM:-未找到}"
          echo "Module.symvers=$SV"
          if [ ! -f "$IMG" ] || [ ! -f "$SV" ] || [ -z "$VM" ]; then
            echo "::error title=KMI CRC 对齐无法进行::缺 Image/Module.symvers/vmlinux, 拒绝产出可能卡第一屏的镜像"
            exit 1
          fi
          chmod +w "$IMG" "$SV" 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/tools/patch_kcrctab.py" \
            --image "$IMG" --vmlinux "$VM" --symvers "$SV" \
            --manifest "$GITHUB_WORKSPACE/device/meizu21/module_kmi_manifest.txt" \
            --symvers-out "$GITHUB_WORKSPACE/Module.symvers.patched" \
            --report "$GITHUB_WORKSPACE/patch_crc_report.txt" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-logs/patch_kcrctab.log"
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          grep -q '回读校验' "$GITHUB_WORKSPACE/patch_crc_report.txt" || { echo "::error::CRC 对齐未产生回读校验"; exit 1; }
          if grep -q '回读校验.*有失败' "$GITHUB_WORKSPACE/patch_crc_report.txt"; then
            echo "::error title=CRC 写入回读失败::见 patch_crc_report.txt"
            exit 1
          fi
          D="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          [ -d "$D" ] && cp -f "$IMG" "$D/Image" || true
          if [ -f "$SRC_DIR/Image.lz4" ] && command -v lz4 >/dev/null 2>&1; then
            lz4 -f -l -12 "$IMG" "$SRC_DIR/Image.lz4" || true
          fi
          echo "=== KMI CRC 对齐报告(节选) ==="
          head -45 "$GITHUB_WORKSPACE/patch_crc_report.txt"

      # CFI 类型哈希导出(诊断)。背景: CONFIG_CFI_CLANG=y 时, 厂商模块通过函数指针调用内核函数,
      # 编译期会把"期望的 kcfi 类型哈希"写死在调用点; 内核侧该函数也带一个 __kcfi_typeid_<name>
      # 绝对符号(值就是哈希)。两者不一致 → brk → "CFI failure ... (target: X; expected type: 0x..)"
      # → panic → 看门狗复位。哈希由函数原型(含指针所指向对象的 const/volatile)决定,
      # 所以原厂对 mm/ 等子系统的闭源魔改只要动过原型, 就会造成这类崩溃。
      # 这里把内核所有 __kcfi_typeid_* 导出成产物, 与厂商模块调用点里的期望值逐一对账。
      - name: CFI 类型哈希导出 (诊断)
        if: always()
        run: |
          VM=$(find -L "$KERNEL_ROOT" -maxdepth 6 -name vmlinux -type f 2>/dev/null | head -1)
          OUT="$GITHUB_WORKSPACE/cfi_typeids.txt"
          if [ -n "$VM" ] && command -v nm >/dev/null 2>&1; then
            nm "$VM" 2>/dev/null | grep '__kcfi_typeid_' | sort -k3 > "$OUT" || true
            echo "内核 CFI 类型哈希: $(grep -c . "$OUT" || true) 条  (vmlinux=$VM)"
            echo "=== 崩溃现场涉及的关键函数 ==="
            grep -E '__kcfi_typeid_(shrink_slab|do_shrink_slab|reclaim_shmem_address_space)$' "$OUT" \
              || echo "(未列出; 注意 nm 输出格式为 '<哈希> A __kcfi_typeid_<名字>')"
          else
            echo "::warning title=无法导出 CFI 类型哈希::没找到 vmlinux 或 nm"
            echo "no vmlinux or nm" > "$OUT"
          fi

      - name: 准备 Boot 镜像
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: 创建 AnyKernel3 压缩包
        if: inputs.artifact_upload_mode == '上传全部'
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      # 厂商模块(vendor_boot / vendor_dlkm 里的 display/touch/storage 等)自带官方 vermagic 字符串,
      # 内核加载模块时逐字符比对, 不一致就拒绝加载 → 现象: 卡第一屏 2~3 秒后被看门狗重启。
      # 这里把版本串/vermagic 打进日志, 用来核对是否与官方一致。
      - name: 校验内核版本串 / 模块 vermagic
        if: always()
        run: |
          IMG=""
          # 注意: KERNEL_ROOT 是 $GITHUB_ENV 写出来的 → 这里统一用 shell 变量 $KERNEL_ROOT
          # (working-directory 里那种 env 上下文的写法在本步骤内不用, 免得依赖上下文解析)
          : "${KERNEL_ROOT:=$GITHUB_WORKSPACE/$CONFIG}"
          for c in "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" \
                   "$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image"; do
            if [ -f "$c" ]; then IMG="$c"; break; fi
          done
          if [ -z "$IMG" ]; then
            IMG=$(find "$KERNEL_ROOT" -maxdepth 6 -name Image -type f 2>/dev/null | head -1)
          fi
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "未找到 Image, 跳过版本串校验(若是编译失败属正常)"
            if [ -n "${{ inputs.version }}" ]; then
              echo "::warning title=没找到 Image::无法校验版本串是否为 '${{ inputs.version }}'"
            fi
            exit 0
          fi
          echo "Image: $IMG"
          echo "== Linux version 串 =="
          STR=$(strings -a "$IMG" | grep -m1 'Linux version' || true)
          echo "$STR"
          echo "== vermagic =="
          VM=$(strings -a "$IMG" | grep -m1 'SMP preempt mod_unload modversions aarch64' || true)
          echo "$VM"
          WANT="$(echo '${{ inputs.version }}' | tr -d '[:space:]')"
          if [ -n "$WANT" ]; then
            # 注意末尾空格: 这样也能抓到 "重复拼接" 的坏版本串(6.1.25-X-X)
            if printf '%s' "$STR" | grep -qF "$WANT "; then
              echo "✅ 版本串与目标 '$WANT' 一致(厂商模块 vermagic 可匹配)"
            else
              echo "::error title=内核版本串不匹配::期望 '$WANT', 实际 '$STR'。厂商模块会拒绝加载 → 卡第一屏后重启, 这种产物不要刷。"
              exit 1
            fi
          fi

      # 不刷机就验证"内核能不能加载厂商模块":
      # 模块 __versions 里的符号 CRC 必须与内核 Module.symvers 一致, 否则内核拒载该模块
      # (Unknown symbol / disagrees about version of symbol) → 缺显示/存储驱动 → 卡第一屏后重启。
      # 清单由 tools/extract_module_kmi.py 从设备真实 .ko(vendor_boot ramdisk + system_dlkm)生成。
      - name: 校验厂商模块 KMI 兼容性
        if: always()
        run: |
          MANIFEST="$GITHUB_WORKSPACE/device/meizu21/module_kmi_manifest.txt"
          SYMVERS=""
          : "${KERNEL_ROOT:=$GITHUB_WORKSPACE/$CONFIG}"      # 见上: 只用 shell 变量
          for c in "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Module.symvers" \
                   "$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Module.symvers"; do
            if [ -f "$c" ]; then SYMVERS="$c"; break; fi
          done
          if [ -z "$SYMVERS" ]; then
            SYMVERS=$(find "$KERNEL_ROOT" -maxdepth 8 -name 'Module.symvers' -type f 2>/dev/null | head -1)
          fi
          if [ ! -f "$MANIFEST" ] || [ -z "$SYMVERS" ] || [ ! -f "$SYMVERS" ]; then
            echo "清单(${MANIFEST:-无})或 Module.symvers(${SYMVERS:-无})缺失, 跳过 KMI 校验"
            exit 0
          fi
          echo "Module.symvers: $SYMVERS"
          cp "$SYMVERS" "$GITHUB_WORKSPACE/Module.symvers"     # 随产物上传, 便于离线核对 CRC
          python3 "$GITHUB_WORKSPACE/tools/check_module_kmi.py" \
            --manifest "$MANIFEST" --symvers "$SYMVERS" \
            --report "$GITHUB_WORKSPACE/module_compat.txt"
          if grep -q '^RESULT: FAIL' "$GITHUB_WORKSPACE/module_compat.txt"; then
            echo "::warning title=厂商模块可能加载失败::见 module_compat.txt(随产物一起上传), 里面列出了缺失符号/CRC 不一致的符号"
          fi

      # 把"构建出来的 .config"与设备原厂 config 自动对比: 判断 config 层是否已对齐,
      # 不必每次人工从镜像里抽 IKCONFIG。(参考 config 由 tools/extract_ref_report.py 从原厂 Image 抽)
      - name: 对比构建 config 与原厂 config
        if: always()
        run: |
          REF="$GITHUB_WORKSPACE/device/meizu21/ref_stock.config"
          OUT="$GITHUB_WORKSPACE/config_vs_stock.txt"
          : "${KERNEL_ROOT:=$GITHUB_WORKSPACE/$CONFIG}"
          : > "$OUT"
          if [ ! -f "$REF" ]; then
            echo "缺少参考 config $REF, 跳过" >> "$OUT"; cat "$OUT"; exit 0
          fi
          EXTRACT="$KERNEL_ROOT/common/scripts/extract-ikconfig"
          IMG=""
          for c in "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" \
                   "$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image"; do
            if [ -f "$c" ]; then IMG="$c"; break; fi
          done
          if [ -z "$IMG" ]; then
            IMG=$(find "$KERNEL_ROOT" -maxdepth 6 -name Image -type f 2>/dev/null | head -1)
          fi
          if [ -z "$IMG" ] || [ ! -f "$IMG" ] || [ ! -f "$EXTRACT" ]; then
            echo "Image(${IMG:-无}) 或 extract-ikconfig 不可用, 跳过" >> "$OUT"; cat "$OUT"; exit 0
          fi
          OUR="$RUNNER_TEMP/ours.config"
          if ! bash "$EXTRACT" "$IMG" > "$OUR" 2>/dev/null || [ ! -s "$OUR" ]; then
            echo "从 Image 抽 .config 失败(IKCONFIG 未开?), 跳过" >> "$OUT"; cat "$OUT"; exit 0
          fi
          norm() { grep -E '^(# )?CONFIG_' "$1" | sed -E 's/[[:space:]]+$//' | LC_ALL=C sort; }
          norm "$OUR" > "$RUNNER_TEMP/ours.norm" || true
          norm "$REF" > "$RUNNER_TEMP/ref.norm" || true
          {
            echo "== 构建结果 config vs 原厂(设备)config =="
            echo "差异行数: $(diff "$RUNNER_TEMP/ref.norm" "$RUNNER_TEMP/ours.norm" 2>/dev/null | grep -c '^[<>]' || true)  (< 原厂 / > 我们)"
            echo ""
            diff "$RUNNER_TEMP/ref.norm" "$RUNNER_TEMP/ours.norm" 2>/dev/null || true
          } >> "$OUT"
          head -100 "$OUT"

      - name: 准备 AnyKernel3 目录
        if: inputs.artifact_upload_mode != '上传全部'
        run: |
          mv ./Image "$ANYKERNEL3/Image"

      - name: 构建 Boot 镜像 (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: 构建 Boot 镜像 (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16'
        working-directory: bootimgs
        run: |
          # ★ 只构建未压缩 Image 的 boot.img:
          #   实测原厂 boot_a.img 里就是未压缩 arm64 Image(32.3MB, 开头 1f2003d5...),
          #   我们构建出的 Image 也是未压缩的。gz/lz4 只是同一内核的不同压缩方式,
          #   bootloader 会自动解压 —— 功能完全等价, 属于冗余产物, 不再构建。
          # os_version / os_patch_level 必须写!(Android 12 分支一直有, 13+ 分支以前漏了)
          # 头部这两项为 0 时, 部分 ABL(含魅族 21)会判定镜像非法 → 直接进 fastboot
          ANDROID_MAJOR=$(echo "${{ inputs.android_version }}" | tr -dc '0-9')
          OS_VERSION="${ANDROID_MAJOR}.0.0"
          OS_PATCH="${{ inputs.os_patch_level }}"
          PART_SIZE=$((64 * 1024 * 1024))
          echo "mkbootimg os_version=${OS_VERSION} os_patch_level=${OS_PATCH} boot_sign=${{ inputs.boot_sign }}"

          OUT="boot.img"
          # ★ 2026-10-03: 这里曾经传 module_blacklist=mz_kshrink_slabd, 但实测【完全无效】:
          #   刷入 run 14 后设备上 lsmod 仍能看到 mz_kshrink_slabd —— GKI 的 boot.img cmdline
          #   在 Android 12+ 已让位给 bootconfig, 实际启动参数来自 vendor_boot/ABL, 这里传的
          #   cmdline 不会被采用(原厂 boot.img 的 cmdline 也是空的)。
          #   真正的修复是让内核为 shrink_slab 生成 KCFI 类型哈希, 见前面
          #   「修复 shrink_slab 缺失 KCFI 类型哈希」步骤, 因此这里恢复成空 cmdline。
          CMDLINE=""
          $MKBOOTIMG --header_version 4 --kernel ./Image --output "$OUT" \
            --cmdline "$CMDLINE" \
            --os_version "$OS_VERSION" --os_patch_level "$OS_PATCH"
          echo "boot.img cmdline: $CMDLINE"
          if [ "${{ inputs.boot_sign }}" = "不签名" ]; then
            # 与参考镜像同结构: 不加 AVB, 只把镜像零填充到分区大小
            # (避免分区尾部残留上一次刷入的旧 AVB footer)
            truncate -s "$PART_SIZE" "$OUT"
            echo "$OUT: 未签名, 已零填充到 $((PART_SIZE / 1024 / 1024)) MiB"
          else
            $AVBTOOL add_hash_footer --partition_name boot --partition_size "$PART_SIZE" \
              --image "$OUT" --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
            echo "$OUT: 已加 AVB hash footer"
          fi
          cp "./$OUT" "../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-$OUT"
          echo "已跳过 boot-gz.img / boot-lz4.img(与原厂同格式, 冗余)"

      - name: 收集补丁冲突文件
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          # 跳过上游自带的 .rej：上游分支可能自带已提交的 .rej
          # （如 android15-6.6-2026-04 的 mm/rmap.c.rej），那不是本项目补丁的冲突；
          # patch 失败会覆盖同名文件，所以只跳过「被 git 跟踪且未改动」的
          mapfile -t REJS < <(
            find "$KERNEL_ROOT" -type f -name '*.rej' | sort | while IFS= read -r rej; do
              if git -C "$(dirname "$rej")" ls-files --error-unmatch -- "$(basename "$rej")" >/dev/null 2>&1 \
                && git -C "$(dirname "$rej")" diff --quiet -- "$(basename "$rej")" 2>/dev/null; then
                echo "跳过上游自带的 .rej: ${rej#"$KERNEL_ROOT"/}" >&2
                continue
              fi
              echo "$rej"
            done
          )
          REJ_COUNT=${#REJS[@]}
          echo "发现 $REJ_COUNT 个 .rej 文件"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # 产物名不带 _kernel- 前缀，避免 release 的「上传内核产物」通配到补丁文件
      # 把本轮构建的报告归档到仓库里的 release/ 文件夹(★这不是 GitHub 的 Release 发布产物)。
      # 目的: 不用登录 Actions 页面就能直接翻看构建出的 TXT(module_compat / patch_crc_report /
      # config_vs_stock / source_revision 等)。只保留最近 2 份, 更早的自动删除。
      # 只归档文本与小文件 —— .img/.zip 不入库(那些在 Release 与 dist 分支), 避免仓库历史膨胀。
      # 触发路径不含 release/**, 提交归档不会再次触发构建。
      - name: 归档构建报告到 release/ (保留 2 份)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          BRANCH="${{ github.event.repository.default_branch }}"
          [ -n "$BRANCH" ] || BRANCH="main"
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          DIR_NAME="run-${RUN_NUM}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          STAGE="$RUNNER_TEMP/release-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/$DIR_NAME"
          cp -f "$GITHUB_WORKSPACE"/*.txt "$STAGE/$DIR_NAME/" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/Module.symvers.patched" "$STAGE/$DIR_NAME/" 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/patch-rejects" ]; then
            mkdir -p "$STAGE/$DIR_NAME/patch-rejects"
            cp -f "$GITHUB_WORKSPACE"/patch-rejects/* "$STAGE/$DIR_NAME/patch-rejects/" 2>/dev/null || true
          fi
          {
            echo "# 构建报告 run ${RUN_NUM}"
            echo ""
            echo "- 时间(UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- 结果: ${{ job.status }}"
            echo "- 提交: ${GITHUB_SHA}"
            echo "- 运行页面: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- GKI: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}"
            echo "- 变体/模式: ${{ inputs.ksu_variant }} / ${{ inputs.ksu_mode }} (SUSFS=${{ inputs.enable_susfs }})"
            echo "- LTO: ${{ inputs.lto_mode }}"
            echo ""
            echo "## 本轮归档的文件"
            echo ""
            ls -1 "$STAGE/$DIR_NAME" | sed 's/^/- /'
          } > "$STAGE/$DIR_NAME/README.md"
          echo "=== 归档内容 ==="
          ls -la "$STAGE/$DIR_NAME"

          for attempt in 1 2 3; do
            TARGET="$RUNNER_TEMP/repo-release-$attempt"
            rm -rf "$TARGET"
            if ! git clone -q --depth 1 --filter=blob:none --sparse "$REMOTE" "$TARGET"; then
              echo "克隆失败, 5s 后重试..."
              sleep 5
              continue
            fi
            git -C "$TARGET" sparse-checkout set release
            mkdir -p "$TARGET/release"
            rm -rf "$TARGET/release/$DIR_NAME"
            cp -r "$STAGE/$DIR_NAME" "$TARGET/release/$DIR_NAME"
            # 只保留最近 2 份: 目录名形如 run-<构建号>, 按数值排序删掉更早的
            if [ -d "$TARGET/release" ]; then
              ( cd "$TARGET/release" && ls -1d run-* 2>/dev/null | sed 's/^run-//' | sort -n | head -n -2 | while read -r old; do
                  echo "删除过期归档: release/run-$old"
                  rm -rf "run-$old"
                done ) || true
            fi
            git -C "$TARGET" config user.email "action@github.com"
            git -C "$TARGET" config user.name "github-actions[bot]"
            git -C "$TARGET" add -A release
            if git -C "$TARGET" diff --cached --quiet; then
              echo "无归档变更"
              exit 0
            fi
            git -C "$TARGET" commit -q -m "release: 构建报告 run ${RUN_NUM} ($(echo "${GITHUB_SHA}" | cut -c1-8)) 结果=${{ job.status }}"
            if git -C "$TARGET" push -q origin "HEAD:$BRANCH"; then
              echo "归档已提交: $BRANCH/release/$DIR_NAME/"
              exit 0
            fi
            echo "第 $attempt 次推送失败, 5s 后重试..."
            sleep 5
          done
          echo "::warning::归档推送失败(不影响构建结论)"

      - name: 上传 SUSFS 集成补丁
        if: success() && env.SUSFS_PATCH_EXPORT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SUSFS-Patch-${{ inputs.ksu_variant }}-${{ env.CONFIG }}-${{ inputs.os_patch_level }}
          path: susfs-patch/
          if-no-files-found: warn
          compression-level: 9

      - name: 上传 AnyKernel3 刷入包
        if: inputs.artifact_upload_mode != '上传全部'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
          path: AnyKernel3/*
          compression-level: 9

      - name: 上传全部构建产物
        if: inputs.artifact_upload_mode == '上传全部'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
            module_compat.txt
            Module.symvers
            Module.symvers.patched
            patch_crc_report.txt
            cfi_typeids.txt
            source_revision.txt
            config_vs_stock.txt
          compression-level: 9

      - name: 上传补丁冲突文件
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
